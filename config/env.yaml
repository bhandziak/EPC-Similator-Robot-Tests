server:
  base_url: "http://localhost:8000"

endpoints:
  ue_collection: "/ues"      # GET (list of UEs), POST (UE attachment)
  ue_member:     "/ues/{id}"  # GET (details of a specific UE), DELETE (UE detachment)
  
  ue_stats:      "/ues/stats?ue_id={id}&include_details=false" # GET (statistics of UEs)
  ue_stats_details: "/ues/stats?ue_id={id}&include_details=true" # GET (detailed statistics of UEs)

  reset: "/reset"             # POST (reset simulation)